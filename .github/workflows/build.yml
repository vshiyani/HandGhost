name: Test and build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libgl1 libglib2.0-0 xvfb xauth
      - run: python -m pip install -r requirements.txt
      - name: Install optional gaze inference engines
        run: python -m pip install -r requirements-models.txt --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip check
      - name: Test on Linux virtual desktop
        env:
          HANDGHOST_TEST_DESKTOP: '1'
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python scripts/run_tests.py
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_tests.py
      - name: Build native executable
        run: python -m PyInstaller --noconfirm --clean HandGhost.spec
      - name: Validate bundled model inference
        if: runner.os == 'Linux'
        run: dist/HandGhost/HandGhost --check-models
      - name: Validate packaged Linux startup and shutdown
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python scripts/smoke_desktop.py --executable dist/HandGhost/HandGhost
      - name: Package release archive and checksum
        run: python scripts/package_release.py --platform ${{ runner.os }} --arch ${{ runner.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: HandGhost-${{ runner.os }}-${{ runner.arch }}
          path: dist/HandGhost*
          if-no-files-found: error
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release
          merge-multiple: true
      - name: Verify archives and checksums
        working-directory: release
        run: |
          test -f HandGhost-Windows-X64.zip
          test -f HandGhost-Linux-X64.tar.gz
          sha256sum --check HandGhost-Windows-X64.zip.sha256
          sha256sum --check HandGhost-Linux-X64.tar.gz.sha256
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "HandGhost $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
